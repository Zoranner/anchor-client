[workspace]
resolver = "2"
members = [
    "crates/anchor-ipc",
    "crates/anchor-scan",
    "crates/anchor-store",
    "crates/anchor-system",
    "service",
    "session",
    "credential",
    "installer/action",
    "installer/setup",
]

[package]
name = "anchor-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anchor Guard 客户端构建与打包工具"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
# 仓库根共享 crate
anchor-core = { path = "../crates/anchor-core" }
anchor-protocol = { path = "../crates/anchor-protocol" }

# 客户端专用 crate
anchor-ipc = { path = "crates/anchor-ipc" }
anchor-store = { path = "crates/anchor-store" }
anchor-scan = { path = "crates/anchor-scan" }
anchor-system = { path = "crates/anchor-system" }

# 序列化与配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 加密与哈希
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
hex = "0.4"

# 存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 时间与 ID
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# 文件事件与扫描
notify = "8"
aho-corasick = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

# CLI 与日志
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# Windows API
windows = "0.61"

# 测试
tempfile = "3"

[dependencies]
anyhow.workspace = true
